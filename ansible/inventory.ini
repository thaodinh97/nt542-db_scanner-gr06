[windows_sql]
# Thay hostname/IP và thông tin WinRM cho các SQL Server Windows cần quản lý.
# Ví dụ:
# sql-win-01 ansible_host=192.168.56.21
# sql-win-02 ansible_host=192.168.56.22

[windows_sql:vars]
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_user=Administrator
ansible_password=ChangeMe!
